<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hat</title>
<style>
  :root {
    --ink: #ffffff;
    --muted: #ffffff;
    --accent: #6a71f0;
    --accent-dark: #7c83ff;
    --panel: rgba(0, 0, 0, 0.45);
    --paper: #fffbf2;
    --border: rgba(255, 255, 255, 0.12);
    --shadow: rgba(0, 0, 0, 0.35);
    --danger: #ef5350;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    padding: 24px;
  }
  .app {
    max-width: 720px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header h1 {
    font-size: 2.4rem;
    margin: 0;
    letter-spacing: 0.04em;
  }
  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-style: italic;
  }
  header h1 { color: #fff; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    box-shadow: 0 4px 20px var(--shadow);
    margin-bottom: 18px;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 1rem;
    background: rgba(255, 255, 255, 0.08);
    color: var(--ink);
    font-family: inherit;
  }
  input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.75); }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    background: rgba(255, 255, 255, 0.12);
  }
  button {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { background: rgba(255, 255, 255, 0.15); cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--accent-dark);
    border: 1px solid var(--accent);
  }
  button.secondary:hover {
    background: var(--accent);
    color: #fff;
  }
  button.danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    padding: 4px 10px;
    font-size: 0.85rem;
  }
  button.danger:hover { background: var(--danger); color: #fff; }
  .papers {
    list-style: none;
    padding: 0;
    margin: 0 0 12px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 40px;
  }
  .papers li {
    background: var(--paper);
    color: #2b2118;
    border: 1px solid #ddc9a8;
    padding: 6px 28px 6px 12px;
    border-radius: 4px;
    position: relative;
    box-shadow: 1px 2px 6px var(--shadow);
    transform: rotate(-1deg);
  }
  .papers li:nth-child(even) { transform: rotate(1.5deg); }
  .papers li:nth-child(3n) { transform: rotate(-0.5deg); }
  .papers li .x {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #a08868;
    cursor: pointer;
    font-size: 1rem;
    padding: 0 4px;
  }
  .papers li .x:hover { color: var(--danger); background: none; }
  .empty,
  .papers li.empty {
    color: #ffffff;
    font-style: italic;
    padding: 8px 0;
  }
  .pick-area {
    text-align: center;
    padding: 16px 0;
  }
  .pick-btn {
    font-size: 1.4rem;
    padding: 14px 40px;
    background: var(--accent-dark);
    border-radius: 999px;
  }
  .result {
    margin-top: 18px;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .result .drawn {
    background: var(--paper);
    color: #2b2118;
    border: 2px dashed var(--accent);
    padding: 18px 28px;
    font-size: 1.5rem;
    border-radius: 6px;
    transform: rotate(-2deg);
    box-shadow: 2px 4px 14px var(--shadow);
    animation: drop 0.4s ease-out;
  }
  @keyframes drop {
    from { transform: translateY(-30px) rotate(6deg); opacity: 0; }
    to   { transform: translateY(0) rotate(-2deg); opacity: 1; }
  }
  .papers.shuffling { pointer-events: none; }
  .papers.shuffling li {
    transition: transform 0.28s cubic-bezier(0.5, 0.1, 0.5, 1);
    will-change: transform;
  }
  .papers.shuffling li .x { display: none; }
  h2 {
    margin: 0 0 12px 0;
    font-size: 1.2rem;
    color: #fff;
  }
  .hat-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .hat-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .hat-list li:last-child { border-bottom: none; }
  .hat-list .name {
    font-weight: bold;
    cursor: pointer;
    flex: 1;
    color: var(--ink);
  }
  .hat-list .name:hover { color: var(--accent-dark); }
  .hat-list .count {
    color: var(--muted);
    font-size: 0.85rem;
    margin-right: 12px;
  }
  .current-name {
    font-size: 1rem;
    color: var(--muted);
    font-style: italic;
    margin-bottom: 8px;
  }
  .save-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal {
    background: linear-gradient(135deg, #1a1640, #2a2660);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px;
    max-width: 420px;
    width: 90%;
    box-shadow: 0 10px 40px var(--shadow);
  }
  .modal h3 {
    margin: 0 0 8px 0;
    color: #fff;
    font-size: 1.2rem;
  }
  .modal p {
    margin: 0 0 16px 0;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .modal .modal-items {
    background: rgba(0, 0, 0, 0.3);
    border-radius: 6px;
    padding: 8px 12px;
    margin-bottom: 16px;
    max-height: 140px;
    overflow-y: auto;
    font-size: 0.9rem;
    color: #fffbf2;
  }
  .modal .modal-items div { padding: 2px 0; }
  .modal-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .modal-actions button {
    width: 100%;
    text-align: left;
    padding: 12px 14px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🎩 Hat</h1>
    <p>Drop your papers in. Pick one at random.</p>
  </header>

  <div class="panel">
    <div class="current-name" id="currentName">Add your papers below, then hit Pick to draw one at random.</div>
    <div class="row">
      <input type="text" id="paperInput" placeholder="Type something and press Enter…" autocomplete="off" />
      <button id="addBtn">Add</button>
    </div>
    <ul class="papers" id="papers"></ul>
    <div class="pick-area">
      <button class="pick-btn" id="pickBtn">Pick</button>
    </div>
    <div class="result" id="result"></div>
  </div>

  <div class="panel">
    <h2>Save this hat</h2>
    <div class="save-row">
      <input type="text" id="hatNameInput" placeholder="e.g. My Favorite Restaurants Hat" />
      <button id="saveBtn">Save</button>
      <button class="secondary" id="newBtn">New</button>
    </div>
  </div>

  <div class="panel">
    <h2>Saved hats</h2>
    <ul class="hat-list" id="hatList"></ul>
    <div class="empty" id="noHats">No saved hats yet.</div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = "hat.savedHats.v1";

  let papers = [];
  let currentHatName = null;

  const paperInput = document.getElementById("paperInput");
  const addBtn = document.getElementById("addBtn");
  const papersEl = document.getElementById("papers");
  const pickBtn = document.getElementById("pickBtn");
  const resultEl = document.getElementById("result");
  const hatNameInput = document.getElementById("hatNameInput");
  const saveBtn = document.getElementById("saveBtn");
  const newBtn = document.getElementById("newBtn");
  const hatListEl = document.getElementById("hatList");
  const noHatsEl = document.getElementById("noHats");
  const currentNameEl = document.getElementById("currentName");

  function loadHats() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveHats(hats) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(hats));
  }

  function renderPapers() {
    papersEl.innerHTML = "";
    if (papers.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.style.background = "transparent";
      li.style.border = "none";
      li.style.transform = "none";
      li.style.boxShadow = "none";
      li.textContent = "The hat is empty.";
      papersEl.appendChild(li);
      return;
    }
    papers.forEach((p, i) => {
      const li = document.createElement("li");
      li.textContent = p;
      const x = document.createElement("button");
      x.className = "x";
      x.textContent = "×";
      x.title = "Remove";
      x.addEventListener("click", () => {
        papers.splice(i, 1);
        renderPapers();
      });
      li.appendChild(x);
      papersEl.appendChild(li);
    });
  }

  function renderHatList() {
    const hats = loadHats();
    const names = Object.keys(hats).sort();
    hatListEl.innerHTML = "";
    if (names.length === 0) {
      noHatsEl.style.display = "block";
      return;
    }
    noHatsEl.style.display = "none";
    names.forEach((name) => {
      const li = document.createElement("li");
      const nameSpan = document.createElement("span");
      nameSpan.className = "name";
      nameSpan.textContent = name;
      nameSpan.title = "Click to open";
      nameSpan.addEventListener("click", () => openHat(name));

      const count = document.createElement("span");
      count.className = "count";
      count.textContent = `${hats[name].length} item${hats[name].length === 1 ? "" : "s"}`;

      const del = document.createElement("button");
      del.className = "danger";
      del.textContent = "Delete";
      del.addEventListener("click", () => {
        if (confirm(`Delete "${name}"?`)) {
          const h = loadHats();
          delete h[name];
          saveHats(h);
          if (currentHatName === name) {
            currentHatName = null;
            updateCurrentName();
          }
          renderHatList();
        }
      });

      li.appendChild(nameSpan);
      li.appendChild(count);
      li.appendChild(del);
      hatListEl.appendChild(li);
    });
  }

  function updateCurrentName() {
    currentNameEl.textContent = currentHatName
      ? `Editing: ${currentHatName}`
      : "Add your papers below, then hit Pick to draw one at random.";
    hatNameInput.value = currentHatName || "";
  }

  function openHat(name) {
    const hats = loadHats();
    if (!hats[name]) return;
    papers = hats[name].slice();
    currentHatName = name;
    resultEl.innerHTML = "";
    updateCurrentName();
    renderPapers();
  }

  function addPaper() {
    const val = paperInput.value.trim();
    if (!val) return;
    papers.push(val);
    paperInput.value = "";
    paperInput.focus();
    renderPapers();
  }

  let shuffling = false;
  function shuffleOnce() {
    const lis = Array.from(papersEl.querySelectorAll("li"));
    if (lis.length < 2) return;
    const oldRects = new Map(lis.map(li => [li, li.getBoundingClientRect()]));
    // Reorder DOM
    const shuffled = lis.slice();
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    shuffled.forEach(li => papersEl.appendChild(li));
    // FLIP: jump back to old positions instantly, then animate to new
    lis.forEach(li => {
      const newRect = li.getBoundingClientRect();
      const oldRect = oldRects.get(li);
      const dx = oldRect.left - newRect.left;
      const dy = oldRect.top - newRect.top;
      li.style.transition = "none";
      const startRot = (Math.random() - 0.5) * 30;
      li.style.transform = `translate(${dx}px, ${dy}px) rotate(${startRot}deg)`;
    });
    void papersEl.offsetWidth;
    lis.forEach(li => {
      li.style.transition = "";
      const endRot = (Math.random() - 0.5) * 12;
      li.style.transform = `rotate(${endRot}deg)`;
    });
  }

  function pick() {
    if (papers.length === 0) {
      resultEl.innerHTML = '<div class="empty">Add some papers first!</div>';
      return;
    }
    if (shuffling) return;
    shuffling = true;
    pickBtn.disabled = true;
    resultEl.innerHTML = "";
    papersEl.classList.add("shuffling");

    shuffleOnce();
    const interval = setInterval(shuffleOnce, 300);

    setTimeout(() => {
      clearInterval(interval);
      papersEl.classList.remove("shuffling");
      shuffling = false;
      pickBtn.disabled = false;

      const idx = Math.floor(Math.random() * papers.length);
      const choice = papers[idx];
      papers.splice(idx, 1);
      renderPapers();

      const div = document.createElement("div");
      div.className = "drawn";
      div.textContent = choice;
      void div.offsetWidth;
      resultEl.appendChild(div);
    }, 1100);
  }

  function saveCurrent() {
    const name = hatNameInput.value.trim();
    if (!name) {
      alert("Give your hat a name first.");
      hatNameInput.focus();
      return;
    }
    if (papers.length === 0) {
      alert("Add at least one paper before saving.");
      return;
    }
    const hats = loadHats();
    const renaming = currentHatName && currentHatName !== name;
    if (renaming) {
      delete hats[currentHatName];
    }
    hats[name] = papers.slice();
    saveHats(hats);
    currentHatName = name;
    updateCurrentName();
    renderHatList();
  }

  function newHat() {
    if (papers.length > 0 && !confirm("Start a new empty hat? Unsaved papers will be cleared.")) {
      return;
    }
    papers = [];
    currentHatName = null;
    resultEl.innerHTML = "";
    updateCurrentName();
    renderPapers();
  }

  addBtn.addEventListener("click", addPaper);
  paperInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); addPaper(); }
  });
  pickBtn.addEventListener("click", pick);
  saveBtn.addEventListener("click", saveCurrent);
  newBtn.addEventListener("click", newHat);
  hatNameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); saveCurrent(); }
  });

  function decodePayload(encoded) {
    try {
      const json = decodeURIComponent(escape(atob(encoded)));
      const arr = JSON.parse(json);
      if (!Array.isArray(arr)) return null;
      const cleaned = arr
        .map(x => (typeof x === "string" ? x.trim() : ""))
        .filter(Boolean);
      return cleaned.length ? cleaned : null;
    } catch (e) {
      return null;
    }
  }

  function clearUrlParams() {
    history.replaceState(null, "", location.pathname);
  }

  function showImportModal(targetName, incoming, existing, onChoice) {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";

    const modal = document.createElement("div");
    modal.className = "modal";

    const h = document.createElement("h3");
    h.textContent = `Add ${incoming.length} item${incoming.length === 1 ? "" : "s"} to "${targetName}"?`;
    modal.appendChild(h);

    const p = document.createElement("p");
    p.textContent = `This hat already has ${existing.length} item${existing.length === 1 ? "" : "s"}. What would you like to do?`;
    modal.appendChild(p);

    const items = document.createElement("div");
    items.className = "modal-items";
    incoming.forEach(name => {
      const row = document.createElement("div");
      row.textContent = "• " + name;
      items.appendChild(row);
    });
    modal.appendChild(items);

    const actions = document.createElement("div");
    actions.className = "modal-actions";

    function btn(label, choice, cls) {
      const b = document.createElement("button");
      b.textContent = label;
      if (cls) b.className = cls;
      b.addEventListener("click", () => {
        document.body.removeChild(backdrop);
        onChoice(choice);
      });
      return b;
    }

    const targetNameTitle = targetName.replace(/\b\w/g, c => c.toUpperCase());
    actions.appendChild(btn(`Add To Existing ${targetNameTitle} Hat`, "add"));
    actions.appendChild(btn(`Replace Existing ${targetNameTitle} Hat With Just The New Items`, "replace", "secondary"));
    actions.appendChild(btn("Save These As A Brand New Hat", "new", "secondary"));

    modal.appendChild(actions);
    backdrop.appendChild(modal);
    document.body.appendChild(backdrop);
  }

  function timestampSuffix() {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function applyImport(targetName, items) {
    const hats = loadHats();
    hats[targetName] = items.slice();
    saveHats(hats);
    openHat(targetName);
    renderHatList();
  }

  function importFromUrl() {
    const params = new URLSearchParams(location.search);
    const source = params.get("source");
    const encoded = params.get("items");
    if (!source || !encoded) return;

    const items = decodePayload(encoded);
    clearUrlParams();
    if (!items) return;

    const targetName =
      source === "cuisine"
        ? "Cuisine at random"
        : source === "activity"
        ? "Activity at random"
        : null;
    if (!targetName) return;

    const hats = loadHats();
    const existing = hats[targetName];

    if (!existing || existing.length === 0) {
      applyImport(targetName, items);
      return;
    }

    showImportModal(targetName, items, existing, choice => {
      if (choice === "add") {
        const merged = existing.slice();
        items.forEach(name => {
          if (!merged.includes(name)) merged.push(name);
        });
        applyImport(targetName, merged);
      } else if (choice === "replace") {
        applyImport(targetName, items);
      } else if (choice === "new") {
        applyImport(`${targetName} (${timestampSuffix()})`, items);
      }
    });
  }

  renderPapers();
  renderHatList();
  updateCurrentName();
  importFromUrl();
})();
</script>
</body>
</html>
